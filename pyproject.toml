[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-workspace-manager"
version = "0.1.0"
description = "Local, read-only workspace browser with live document previews"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
workspace-manager = "workspace_manager.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workspace_manager = ["static/*", "static/vendor/*"]
